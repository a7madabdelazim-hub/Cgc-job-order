<style>
/* ===================== RESET & BASE ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {

/* ===================== LAYOUT ===================== */
#app { min-hesight: 100vh; min-height: 100vh; display: flex; flex-direction: column; min-height: 100vh; }

/* Loading overlay */
.loading-overlay {

.loading-text { color: rgba(255,255,255,0.85); font-size: 13px; letter-spacing: 0.05em; }

}

/* Top bar */
.topbar {

.form-section.expanded .form-section-header { border-bottom: 1px solid #e2e8f0; }

.form-field { display: flex; flex-direction: column; gap: 6px; }

.form-input, .form-select, .form-textarea {

.form-textarea { min-height: 72px; resize: vertical; }
.form-select {

  background-repeat: no-repeat; background-position: right 12px center; padding-right: 36px;
}

/* Fixed field with lock icon */
.fixed-field { display: flex; align-items: center; gap: 8px; }
.fixed-field .form-input { flex: 1; }
.fixed-field .lock-icon { color: #94a3b8; flex-shrink: 0; }

/* Job Order prefix + suffix */
.jo-input { display: flex; align-items: stretch; }
.jo-prefix {

}
.jo-input .form-input { border-radius: 0 10px 10px 0; }

/* Process block */
.process-block {

  background: linear-gradient(180deg, rgba(248,250,252,0.8), rgba(241,245,249,0.4));

}
.process-block:last-child { margin-bottom: 0; }
.process-block-title {

  text-transform: uppercase; letter-spacing: 0.03em;
}

/* ===================== CHIPS (Multi-select) ===================== */
.chip-group {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 4px 0;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 14px; border-radius: 20px;
  border: 1.5px solid #e2e8f0; background: #fff; color: #475569;
  font-size: 14px; font-weight: 500; min-height: 36px;

  -webkit-user-select: none; user-select: none;
  cursor: pointer;
}
.chip:active { transform: scale(0.95); }
.chip.selected {
  background: linear-gradient(135deg, #1e3a8a, #1e40af);
  color: #fff; border-color: #1e3a8a;
  box-shadow: 0 2px 8px rgba(30,58,138,0.25);
}
.chip.selected::before {
  content: '✓ '; font-weight: 700; margin-right: 2px;
}

/* ===================== PREVIEW (A4) — Enhanced for export ===================== */
.preview-wrapper {

}
.preview-scaler {

}
.job-order-preview {
  background: #fff; color: #0f172a; width: 794px; min-height: 1123px;

  font-size: 13px; line-height: 1.55;
}
/* Header */
.jo-header {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding-bottom: 16px; border-bottom: 3px solid #1e3a8a;
}
.jo-header-left { display: flex; align-items: center; gap: 16px; }
.jo-logo-box {
  width: 72px; height: 72px; border-radius: 12px;
  background: linear-gradient(135deg, #1e3a8a, #0f172a);
  display: flex; align-items: center; justify-content: center;

.jo-title-bar {

}

/* Section */
.jo-section { margin-top: 16px; }
.jo-section-header {

  border-radius: 6px 6px 0 0; color: #fff;

.jo-section-header.dark { background: linear-gradient(135deg, #1e3a8a, #1e40af); }

/* Colors */

.hidden-export-preview {

/* ===================== MODAL ===================== */

.hidden { display: none !important; }

/* ===================== HELPERS ===================== */
function todaysDate() {
  var d = new Date();
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: '2-digit' });
}

function getValue(obj, path) {
  return path.split('.').reduce(function(acc, key) { return acc ? acc[key] : undefined; }, obj);
}

function setValue(obj, path, value) {
  var clone = JSON.parse(JSON.stringify(obj));
  var keys = path.split('.');
  var curr = clone;
  for (var i = 0; i < keys.length - 1; i++) {
    if (!curr[keys[i]]) curr[keys[i]] = {};
    curr = curr[keys[i]];
  }
  curr[keys[keys.length - 1]] = value;
  return clone;
}

// Toggle a value in an array (for multi-select chips)
function toggleArrayValue(arr, value) {
  if (!Array.isArray(arr)) arr = [];
  var idx = arr.indexOf(value);
  if (idx >= 0) {
    return arr.filter(function(v) { return v !== value; });
  }
  return arr.concat([value]);
}

// Format chip array for display
function formatChipArray(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return '';
  return arr.join(', ');
}

// Format Outside/Inside display — includes Spcl Color name if selected
function formatColorChoice(arr, spclColorName) {
  if (!Array.isArray(arr) || arr.length === 0) return '';
  var parts = arr.slice();
  var spclIdx = parts.indexOf('Spcl Color');
  if (spclIdx >= 0) {
    if (spclColorName && spclColorName.trim()) {
      parts[spclIdx] = 'Spcl Color: ' + spclColorName.trim();
    }
  }
  return parts.join(', ');
}

function formatDeliveryDate(dateStr) {
  if (!dateStr || !dateStr.trim()) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr.trim());
  if (m) {
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (!isNaN(d.getTime())) {
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: '2-digit' });
    }
  }
  return dateStr;
}

function jobOrderSuffix(value) {
  if (value.indexOf(JOB_ORDER_PREFIX) === 0) return value.slice(JOB_ORDER_PREFIX.length);
  return value;
}

function normalizeJobOrderNo(value) {
  var v = String(value || '').trim();
  if (!v) return JOB_ORDER_PREFIX;
  if (v.indexOf(JOB_ORDER_PREFIX) === 0) return v;
  return JOB_ORDER_PREFIX + v.replace(/^[^a-zA-Z0-9]+/, '');
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ===================== CHIPS RENDERING ===================== */
function renderChips(path, options, selectedArr, rerenderOnChange) {
  var selected = Array.isArray(selectedArr) ? selectedArr : [];
  var html = '<div class="chip-group" data-chip-group="' + path + '"' +
    (rerenderOnChange ? ' data-rerender="true"' : '') + '>';
  options.forEach(function(opt) {
    var isSelected = selected.indexOf(opt) >= 0;
    html += '<button type="button" class="chip' + (isSelected ? ' selected' : '') +
      '" data-chip-value="' + esc(opt) + '" data-path="' + path + '">' + esc(opt) + '</button>';
  });
  html += '</div>';
  return html;
}

  `;
}

  html += joSection('3. PRODUCTION PROCESS DETAILS', 'dark',
    '<div class="jo-process-grid">' +
      processCard('card-purple', icons.printer, '3.1', 'PRINTING – COLORS', [
        ['Outside', formatColorChoice(p.printing.outside, p.printing.outsideSpclColor)],
        ['Inside', formatColorChoice(p.printing.inside, p.printing.insideSpclColor)],
        ['Water Base Outside', formatChipArray(p.printing.waterBaseOutside)],
        ['Water Base Inside', formatChipArray(p.printing.waterBaseInside)],
        ['Special Instructions', p.printing.instructions]
      ]) +
      processCard('card-teal', icons.layers, '3.2', 'LAMINATION', [
        ['Outside', formatChipArray(p.lamination.outside)],
        ['Inside', formatChipArray(p.lamination.inside)],
        ['Special Instructions', p.lamination.instructions]
      ]) +
      processCard('card-orange', icons.scissors, '3.3', 'DIE CUTTING', [
        ['Die Cutting', formatChipArray(p.dieCutting.option)],
        ['Special Instructions', p.dieCutting.instructions]
      ]) +
      processCard('card-green', icons.packageCheck, '3.4', 'FINISHING', [
        ['Finishing', formatChipArray(p.finishing.option)],
        ['Mold', formatChipArray(p.finishing.mold)],
        ['Special Instructions', p.finishing.instructions]
      ]) +
    '</div>'
  );

  // Section 4: Approval
  html += joSection('4. APPROVAL', 'dark',
    '<div class="jo-approval-grid">' +
      sigBlock('Prepared By (Sales)', a.preparedBy) +
      sigBlock('Checked By (Production)', a.checkedBy) +
      sigBlock('Approved By (Manager)', a.approvedBy) +
    '</div>'
  );

  // Footer
  html += '<div class="jo-footer">' + icons.shieldCheck +
    '<span class="jo-footer-text">Thank you for choosing ' + esc(d.company.name) + '!</span>' +
  '</div>';
  html += '<div class="jo-footer-note">This is a computer-generated document. No signature is required.</div>';

  html += '</div>';
  return html;
}

function joSection(title, tone, body) {
  return '<div class="jo-section">' +
    '<div class="jo-section-header ' + tone + '">' + esc(title) + '</div>' +
    '<div class="jo-section-body">' + body + '</div>' +
  '</div>';
}

/* ===================== MAIN APP RENDER ===================== */
function renderApp() {
  var app = document.getElementById('app');

  var topbar = `
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <div class="topbar-logo">JF</div>
          <div>
            <div class="topbar-title">Century Gate Job Order</div>
            <div class="topbar-sub">Fill the form, export PNG / PDF</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline" data-action="reset" ${busy ? 'disabled' : ''}>${icons.rotateCcw} Reset</button>
          <button class="btn btn-primary" data-action="png" ${busy ? 'disabled' : ''}>${icons.fileImage} ${busy === 'png' ? 'Exporting…' : 'Export PNG'}</button>
          <button class="btn btn-primary" data-action="pdf" ${busy ? 'disabled' : ''}>${icons.fileText} ${busy === 'pdf' ? 'Exporting…' : 'Export PDF'}</button>
        </div>
      </div>
    </header>
  `;

  var formContent = '<div id="formContainer">' + renderForm() + '</div>';
  var previewHTML = renderPreviewHTML(state);

  var main;
  if (isDesktop) {
    main = `
      <main class="main">
        <div class="desktop-split">
          <div class="panel">
            <div class="panel-header">${icons.pencil} Form Editor</div>
            <div class="panel-body" id="formScroll">${formContent}</div>
          </div>
          <div class="panel">
            <div class="panel-header">${icons.eye} Live Preview (A4)<span class="hint">Auto-syncs with the form</span></div>
            <div class="panel-body" id="previewScroll">
              <div class="preview-wrapper">
                <div id="previewVisible">${previewHTML}</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    `;
  } else {
    main = `
      <main class="main">
        <div class="mobile-tabs">
          <div class="tab-list">
            <button class="tab-btn ${activeTab === 'edit' ? 'active' : ''}" data-tab="edit">${icons.pencil} Edit</button>
            <button class="tab-btn ${activeTab === 'preview' ? 'active' : ''}" data-tab="preview">${icons.eye} Preview</button>
          </div>
          <div class="tab-panel ${activeTab === 'edit' ? 'active' : ''}" id="tabEdit">
            <div class="panel">
              <div class="panel-body">${formContent}</div>
            </div>
          </div>
          <div class="tab-panel ${activeTab === 'preview' ? 'active' : ''}" id="tabPreview">
            <div class="preview-wrapper" id="mobilePreviewWrapper">
              <div class="preview-scaler" id="mobilePreviewScaler">
                ${previewHTML}
              </div>
            </div>
          </div>
        </div>
      </main>
    `;
  }

  var footer = `
    <footer class="app-footer">
      <div class="app-footer-inner">
        <span>Fill the form, see the live preview, export PNG / PDF.</span>
        <span>Your data stays in your browser.</span>
      </div>
    </footer>
  `;

  var hiddenPreview = '';
  if (!isDesktop) {
    hiddenPreview = '<div class="hidden-export-preview" id="hiddenExportPreview">' + previewHTML + '</div>';
  }

  app.innerHTML = topbar + main + footer + hiddenPreview;

  attachListeners();

  if (!isDesktop) {
    updateMobileScale();
  }
}

/* ===================== EVENT HANDLING ===================== */
function attachListeners() {
  var formContainer = document.getElementById('formContainer');
  if (formContainer) {
    // Input changes (text + textarea + date)
    formContainer.addEventListener('input', function(e) {
      var el = e.target;
      var path = el.getAttribute('data-path');
      if (!path) return;
      var type = el.getAttribute('data-type');
      var value = el.value;
      if (type === 'jobOrderNo') {
        value = normalizeJobOrderNo(value);
      }
      state = setValue(state, path, value);
      schedulePreviewUpdate();
    });

    // Chip clicks (multi-select)
    formContainer.addEventListener('click', function(e) {
      var chip = e.target.closest('.chip');
      if (chip) {
        var path = chip.getAttribute('data-path');
        var value = chip.getAttribute('data-chip-value');
        var group = chip.closest('.chip-group');
        var rerender = group && group.getAttribute('data-rerender') === 'true';
        if (path) {
          var currentArr = getValue(state, path);
          var newArr = toggleArrayValue(currentArr, value);
          state = setValue(state, path, newArr);

          if (rerender) {
            // Re-render form to show/hide Spcl Color inputs
            formContainer.innerHTML = renderForm();
          } else {
            // Just toggle the chip class
            chip.classList.toggle('selected');
          }
          schedulePreviewUpdate();
        }
        return;
      }

      // Section toggles
      var toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        var id = toggle.getAttribute('data-toggle');
        openSections[id] = !openSections[id];
        var sectionEl = toggle.closest('.form-section');
        if (sectionEl) sectionEl.classList.toggle('expanded');
      }
    });

    // Today button
    var todayBtn = formContainer.querySelector('[data-action="today"]');
    if (todayBtn) {
      todayBtn.addEventListener('click', function() {
        state = setValue(state, 'date', todaysDate());
        renderApp();
      });
    }
  }

  // Tab switching (mobile)
  var tabBtns = document.querySelectorAll('[data-tab]');
  tabBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      activeTab = btn.getAttribute('data-tab');
      renderApp();
    });
  });

  // Top bar actions
  var actionBtns = document.querySelectorAll('[data-action]');
  actionBtns.forEach(function(btn) {
    var action = btn.getAttribute('data-action');
    if (action === 'png' || action === 'pdf' || action === 'reset') {
      btn.addEventListener('click', function() {
        if (action === 'png') doExport('png');
        else if (action === 'pdf') doExport('pdf');
        else if (action === 'reset') doReset();
      });
    }
  });

  // Modal close on overlay click
  var overlay = document.getElementById('modalOverlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeModal();
    });
  }
}

/* ===================== PREVIEW UPDATE (debounced) ===================== */
function schedulePreviewUpdate() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(function() {
    updatePreviewOnly();
    rafId = null;
  });
}

function updatePreviewOnly() {
  var previewHTML = renderPreviewHTML(state);

  var desktopPreview = document.getElementById('previewVisible');
  if (desktopPreview) desktopPreview.innerHTML = previewHTML;

  var scaler = document.getElementById('mobilePreviewScaler');
  if (scaler) scaler.innerHTML = previewHTML;

  var hidden = document.getElementById('hiddenExportPreview');
  if (hidden) hidden.innerHTML = previewHTML;

  if (!isDesktop) updateMobileScale();
}

/* ===================== MOBILE PREVIEW SCALING ===================== */
function updateMobileScale() {
  var wrapper = document.getElementById('mobilePreviewWrapper');
  var scaler = document.getElementById('mobilePreviewScaler');
  if (!wrapper || !scaler) return;

  var availW = wrapper.clientWidth - 40; // padding
  var newScale = Math.min(1, Math.max(0.2, availW / 794));

  var innerEl = scaler.querySelector('.job-order-preview');
  var innerH = innerEl ? innerEl.offsetHeight : 1123;

  previewScale = newScale;
  previewHeight = innerH;

  var scaledWidth = 794 * newScale;
  scaler.style.transform = 'scale(' + newScale + ')';
  scaler.style.transformOrigin = 'top left';
  scaler.style.position = 'absolute';
  scaler.style.left = '50%';
  scaler.style.top = '0';
  scaler.style.marginLeft = -(scaledWidth / 2) + 'px';
  wrapper.style.position = 'relative';
  wrapper.style.height = (innerH * newScale + 40) + 'px';
}

/* ===================== RESET ===================== */
function doReset() {
  state = createDefaultState();
  renderApp();
}

/* ===================== EXPORT ===================== */
function getExportElement() {
  if (isDesktop) {
    return document.querySelector('#previewVisible .job-order-preview');
  } else {
    return document.querySelector('#hiddenExportPreview .job-order-preview');
  }
}

// Lazy-load jsPDF only when needed
function loadJsPdf() {
  return new Promise(function(resolve, reject) {
    if (jsPdfLoaded && window.jspdf) {
      resolve(window.jspdf);
      return;
    }
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    script.onload = function() {
      jsPdfLoaded = true;
      resolve(window.jspdf);
    };
    script.onerror = function() {
      reject(new Error('Failed to load jsPDF library'));
    };
    document.head.appendChild(script);
  });
}

function doExport(kind) {
  if (busy) return;
  var el = getExportElement();
  if (!el) return;
  if (typeof htmlToImage === 'undefined') {
    alert('Libraries still loading. Please wait a moment and try again.');
    return;
  }

  setBusy(kind);
  var baseFilename = 'job-order-' + (state.jobOrderNo || 'export');

  setTimeout(function() {
    if (kind === 'png') {
      htmlToImage.toPng(el, { pixelRatio: 2, cacheBust: true, backgroundColor: '#ffffff' })
        .then(function(dataUrl) {
          openModal('png', dataUrl, baseFilename + '.png');
          setBusy(null);
        })
        .catch(function(err) {
          alert('Export failed: ' + err.message);
          setBusy(null);
        });
    } else {
      // Lazy-load jsPDF then proceed
      loadJsPdf().then(function() {
        return htmlToImage.toPng(el, { pixelRatio: 2, cacheBust: true, backgroundColor: '#ffffff' });
      }).then(function(pngDataUrl) {
        var img = new Image();
        img.onload = function() {
          try {
            var jsPDF = window.jspdf.jsPDF;
            var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            var pageWidth = pdf.internal.pageSize.getWidth();
            var pageHeight = pdf.internal.pageSize.getHeight();
            var imgWidthMm = pageWidth;
            var imgHeightMm = (img.height * imgWidthMm) / img.width;

            if (imgHeightMm <= pageHeight) {
              pdf.addImage(pngDataUrl, 'PNG', 0, 0, imgWidthMm, imgHeightMm);
            } else {
              var pxPerMm = img.width / pageWidth;
              var pageSlicePx = Math.floor(pageHeight * pxPerMm);
              var position = 0;
              while (position < img.height) {
                var sliceHeight = Math.min(pageSlicePx, img.height - position);
                var sliceCanvas = document.createElement('canvas');
                sliceCanvas.width = img.width;
                sliceCanvas.height = sliceHeight;
                var ctx = sliceCanvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                ctx.drawImage(img, 0, position, img.width, sliceHeight, 0, 0, img.width, sliceHeight);
                var sliceData = sliceCanvas.toDataURL('image/png');
                if (position > 0) pdf.addPage();
                var sliceHeightMm = (sliceHeight * imgWidthMm) / img.width;
                pdf.addImage(sliceData, 'PNG', 0, 0, imgWidthMm, sliceHeightMm);
                position += sliceHeight;
              }
            }
            var dataUrl = pdf.output('datauristring');
            openModal('pdf', dataUrl, baseFilename + '.pdf');
            setBusy(null);
          } catch (err) {
            alert('PDF generation failed: ' + err.message);
            setBusy(null);
          }
        };
        img.onerror = function() {
          alert('Image load failed');
          setBusy(null);
        };
        img.src = pngDataUrl;
      }).catch(function(err) {
        alert('Export failed: ' + err.message);
        setBusy(null);
      });
    }
  }, 50);
}

function setBusy(kind) {
  busy = kind;
  var buttons = document.querySelectorAll('[data-action]');
  buttons.forEach(function(btn) {
    var action = btn.getAttribute('data-action');
    if (action === 'png' || action === 'pdf') {
      btn.disabled = !!kind;
      var icon = action === 'png' ? icons.fileImage : icons.fileText;
      var label = kind === action ? 'Exporting…' : (action === 'png' ? 'Export PNG' : 'Export PDF');
      btn.innerHTML = icon + ' ' + label;
    } else if (action === 'reset') {
      btn.disabled = !!kind;
    }
  });
}

/* ===================== MODAL ===================== */
function openModal(kind, dataUrl, filename) {
  exportModal = { kind: kind, dataUrl: dataUrl, filename: filename };

  var title = kind === 'png' ? 'PNG Ready' : 'PDF Ready';
  var desc = isIOS()
    ? 'Long-press the image below to save it to your Photos. (iOS Safari does not allow direct downloads from websites.)'
    : 'Click "Download" below to save the file to your device.';

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;

  var body = document.getElementById('modalBody');
  var content = '';
  if (kind === 'png') {
    content = '<img src="' + dataUrl + '" alt="Job Order Preview">';
  } else {
    content = '<iframe src="' + dataUrl + '" title="PDF Preview"></iframe>';
  }
  content += '<div class="modal-actions">' +
    '<button class="btn btn-outline" id="modalOpenTab">Open in new tab</button>' +
    '<button class="btn btn-primary" id="modalDownload">' + icons.download + ' Download ' + kind.toUpperCase() + '</button>' +
    '<button class="btn btn-outline" id="modalClose">Close</button>' +
  '</div>';
  body.innerHTML = content;

  document.getElementById('modalOverlay').classList.add('open');

  document.getElementById('modalOpenTab').addEventListener('click', function() {
    window.open(dataUrl, '_blank');
  });
  document.getElementById('modalDownload').addEventListener('click', downloadFromModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  exportModal = null;
}

function downloadFromModal() {
  if (!exportModal) return;
  try {
    var dataUrl = exportModal.dataUrl;
    var arr = dataUrl.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    var blob = new Blob([u8], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = exportModal.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    window.open(exportModal.dataUrl, '_blank');
  }
}

/* ===================== RESPONSIVE ===================== */
window.matchMedia('(min-width: 1024px)').addEventListener('change', function(e) {
  isDesktop = e.matches;
  renderApp();
});

window.addEventListener('resize', function() {
  if (!isDesktop) {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function() {
      updateMobileScale();
      rafId = null;
    });
  }
});

/* ===================== INIT ===================== */
function hideLoadingAndInit() {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.classList.add('hidden');
    setTimeout(function() { overlay.remove(); }, 300);
  }
  renderApp();
}

function init() {
  // Wait for html-to-image to load (it's deferred)
  if (typeof htmlToImage === 'undefined') {
    // Listen for it to load
    var checkInterval = setInterval(function() {
      if (typeof htmlToImage !== 'undefined') {
        clearInterval(checkInterval);
        hideLoadingAndInit();
      }
    }, 50);
    // Safety timeout — init anyway after 3s
    setTimeout(function() {
      clearInterval(checkInterval);
      hideLoadingAndInit();
    }, 3000);
  } else {
    hideLoadingAndInit();
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
