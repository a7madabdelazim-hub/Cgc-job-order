<title>Century Gate Job Order</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #eef2ff; color: #0f172a; font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; touch-action: manipulation; overscroll-behavior-y: none;
  --c: #4338ca; --c-soft: #e0e7ff; --c-ink: #3730a3;
}
body[data-step="0"] { --c: #4338ca; --c-soft: #e0e7ff; --c-ink: #3730a3; background: #eef2ff; }
body[data-step="1"] { --c: #0369a1; --c-soft: #e0f2fe; --c-ink: #075985; background: #f0f9ff; }
body[data-step="2"] { --c: #7e22ce; --c-soft: #f3e8ff; --c-ink: #6b21a8; background: #faf5ff; }
body[data-step="3"] { --c: #0f766e; --c-soft: #ccfbf1; --c-ink: #115e59; background: #f0fdfa; }
body[data-step="4"] { --c: #c2410c; --c-soft: #ffedd5; --c-ink: #9a3412; background: #fff7ed; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea { font-family: inherit; font-size: 16px; }

/* Top bar */
.topbar {
  background: linear-gradient(120deg, #172554, #1e3a8a 55%, #4338ca); color: #fff;
  border-bottom: 4px solid #eab308; position: sticky; top: 0; z-index: 30;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
}
.topbar-inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 34px; height: 44px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.topbar-logo img { width: 26px; height: 37px; object-fit: contain; }
.topbar-text { flex: 1; min-width: 0; }
.topbar-title { font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-sub { font-size: 12px; color: #dbeafe; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 700; white-space: nowrap;
  -webkit-user-select: none; user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; pointer-events: none; }
.btn-ghost { border: 1.5px solid rgba(255,255,255,0.6); color: #fff; }
.btn-gold { background: #eab308; color: #422006; }
.btn-back { background: #fff; border: 1.5px solid #cbd5e1; color: #334155; }
.btn-next { background: var(--c); color: #fff; flex: 1; font-size: 16px; min-height: 50px; box-shadow: 0 4px 12px rgba(15,23,42,0.18); }
.topbar .btn-export { display: none; }

/* Layout */
.layout { max-width: 1500px; margin: 0 auto; padding: 12px 12px 110px 12px; }
.preview-col { display: none; }
@media (min-width: 1024px) {
  .layout { display: grid; grid-template-columns: minmax(420px, 540px) minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
  .preview-col { display: block; position: sticky; top: 84px; }
  .topbar .btn-export { display: inline-flex; }
  .step-actions { position: static !important; padding: 14px 0 0 0 !important; background: none !important; border: none !important; }
}

/* Stepper */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.step-btn {
  min-height: 56px; border-radius: 12px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 700; background: var(--s-soft); color: var(--s-ink); border: 2px solid transparent;
}
.step-btn .num { width: 22px; height: 22px; border-radius: 11px; background: var(--s); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.step-btn.active { background: var(--s); color: #fff; box-shadow: 0 4px 12px rgba(15,23,42,0.2); }
.step-btn.active .num { background: #fff; color: var(--s); }
.step-btn[data-step="0"] { --s: #4338ca; --s-soft: #e0e7ff; --s-ink: #3730a3; }
.step-btn[data-step="1"] { --s: #0369a1; --s-soft: #e0f2fe; --s-ink: #075985; }
.step-btn[data-step="2"] { --s: #7e22ce; --s-soft: #f3e8ff; --s-ink: #6b21a8; }
.step-btn[data-step="3"] { --s: #0f766e; --s-soft: #ccfbf1; --s-ink: #115e59; }
.step-btn[data-step="4"] { --s: #c2410c; --s-soft: #ffedd5; --s-ink: #9a3412; }

/* Panels */
.step-panel { display: none; }
.step-panel.active { display: block; }
.card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
.card-head { padding: 12px 16px; font-size: 15px; font-weight: 800; color: #fff; background: var(--c); display: flex; align-items: center; gap: 8px; }
.card-head svg { width: 18px; height: 18px; flex-shrink: 0; }
.card-body { padding: 16px; }
.card.k-purple .card-head { background: #7e22ce; } .card.k-purple { border-color: #d8b4fe; }
.card.k-teal .card-head { background: #0f766e; } .card.k-teal { border-color: #5eead4; }
.card.k-orange .card-head { background: #c2410c; } .card.k-orange { border-color: #fdba74; }
.card.k-green .card-head { background: #15803d; } .card.k-green { border-color: #86efac; }
.card.k-purple { --c: #7e22ce; } .card.k-teal { --c: #0f766e; } .card.k-orange { --c: #c2410c; } .card.k-green { --c: #15803d; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .form-grid.keep2 { grid-template-columns: 1fr 1fr; } .form-grid.keep3 { grid-template-columns: 1fr 1fr 1fr; } }
.form-grid.keep3 { grid-template-columns: 1fr 1fr 1fr; }
.form-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form-field.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; }
.form-input, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 16px;
  background: #fff; color: #0f172a; min-height: 44px; -webkit-appearance: none; appearance: none;
}
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--c); box-shadow: 0 0 0 3px var(--c-soft); }
.form-input:disabled { background: #f1f5f9; color: #475569; }
.form-input[readonly] { background: #f8fafc; }
.form-textarea { min-height: 72px; resize: vertical; }
.hl-amber .form-label { color: #92400e; } .hl-amber .form-input { background: #fef3c7; border-color: #d97706; font-weight: 700; }
.hl-green .form-label { color: #166534; } .hl-green .form-input { background: #dcfce7; border-color: #16a34a; font-weight: 700; }
.hl-blue .form-label { color: #1e3a8a; } .hl-blue .form-input { background: #dbeafe; border-color: #2563eb; font-weight: 700; }
.hl-purple .form-label { color: #5b21b6; } .hl-purple .form-input { background: #ede9fe; border-color: #7c3aed; font-weight: 700; }
.unit-wrap { position: relative; }
.unit-wrap .form-input { padding-right: 52px; }
.unit-wrap .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 800; color: #475569; pointer-events: none; }
.row-inline { display: flex; gap: 8px; align-items: stretch; }
.row-inline .form-input { flex: 1; min-width: 0; }
.jo-prefix { display: inline-flex; align-items: center; padding: 0 12px; background: var(--c); color: #fff; font-size: 14px; font-weight: 800; border-radius: 10px 0 0 10px; }
.jo-input { display: flex; }
.jo-input .form-input { border-radius: 0 10px 10px 0; border-left: none; }
.btn-mini { min-height: 44px; padding: 0 14px; border-radius: 10px; background: var(--c-soft); color: var(--c-ink); font-weight: 700; font-size: 14px; }
.sub-gap { margin-top: 14px; }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--c); background: #fff; color: var(--c);
  font-size: 14px; font-weight: 600; -webkit-user-select: none; user-select: none;
}
.chip.selected { background: var(--c); color: #fff; box-shadow: 0 2px 8px rgba(15,23,42,0.2); }
.chip.selected::before { content: '\2713\00a0'; font-weight: 800; }

/* Step actions */
.step-actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px;
  padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: rgba(255,255,255,0.96); border-top: 1px solid #e2e8f0;
}

/* Export panel */
.info-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.info { border-radius: 12px; padding: 10px 14px; border: 1.5px solid #e2e8f0; background: #fff; }
.info .k { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; }
.info .v { font-size: 14px; font-weight: 700; word-break: break-word; }
.info.ok { background: #dcfce7; border-color: #16a34a; } .info.ok .k, .info.ok .v { color: #166534; }
.info.warn { background: #fef3c7; border-color: #d97706; } .info.warn .k, .info.warn .v { color: #92400e; }
.info.bad { background: #fee2e2; border-color: #dc2626; } .info.bad .k, .info.bad .v { color: #991b1b; }

/* Preview pane */
.preview-pane { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,0.06); }
.preview-head { padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; color: #1e3a8a; border-bottom: 1px solid #e2e8f0; }
.fit-badge { margin-left: auto; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
.fit-badge.ok { background: #dcfce7; color: #166534; } .fit-badge.warn { background: #fef3c7; color: #92400e; } .fit-badge.bad { background: #fee2e2; color: #991b1b; }
.preview-wrap { background: #cbd5e1; padding: 12px; overflow: auto; -webkit-overflow-scrolling: touch; }
@media (min-width: 1024px) { .preview-wrap { max-height: calc(100vh - 150px); } }
.preview-sizer { position: relative; margin: 0 auto; box-shadow: 0 4px 16px rgba(15,23,42,0.25); }
.preview-inner { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; transform-origin: top left; }
.preview-hint { font-size: 12px; color: #475569; text-align: center; padding: 8px; }
@media (min-width: 1024px) { .preview-hint { display: none; } }

/* ===================== A4 PAGE (Concept A – Navy Classic) ===================== */
.job-order-preview {
  width: 794px; height: 1123px; padding: 40px 44px; background: #fff; color: #0f172a; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px; line-height: 1.35; text-align: left;
}
.jo-fit { width: 706px; display: flex; flex-direction: column; gap: 10px; transform-origin: top left; }
.jo-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 12px; border-bottom: 3px solid #1e3a8a; }
.jo-header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.jo-logo-box { width: 59px; height: 84px; flex-shrink: 0; }
.jo-logo-img { width: 59px; height: 84px; object-fit: contain; display: block; }
.jo-company-name { font-size: 21px; font-weight: 800; }
.jo-header-right { text-align: right; flex-shrink: 0; }
.jo-no-label { font-size: 12px; font-weight: 600; color: #475569; }
.jo-no { font-size: 18px; font-weight: 800; color: #1e3a8a; }
.jo-date { font-size: 13px; color: #475569; }
.jo-date b { color: #0f172a; }
.jo-title-bar { background: #1e3a8a; color: #fff; text-align: center; font-weight: 800; letter-spacing: 0.3em; padding: 7px 0; font-size: 16px; border-radius: 4px; }
.jo-sec-head { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; padding: 5px 12px; border-radius: 4px 4px 0 0; background: #1e3a8a; }
.jo-sec-head.light { background: #2563eb; }
.jo-sec-body { border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 4px 4px; padding: 9px 12px; }
.jo-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; }
.r { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.rl { width: 128px; flex-shrink: 0; font-size: 12px; font-weight: 600; color: #1e3a8a; }
.rl.n { width: 96px; } .rl.w { width: 118px; }
.rv { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #b91c1c; word-break: break-word; white-space: pre-wrap; }
.rv.s { font-size: 12px; }
.jo-prod { display: flex; gap: 20px; }
.jo-prod-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.jo-tiles { width: 400px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start; }
.t { border-radius: 6px; padding: 6px 10px; min-width: 0; }
.t .tl { font-size: 12px; font-weight: 700; }
.t .tv { font-size: 16px; font-weight: 800; color: #0f172a; word-break: break-word; }
.t .tu { font-size: 12px; font-weight: 700; }
.t.amber { background: #fef3c7; } .t.amber .tl, .t.amber .tu { color: #92400e; }
.t.green { background: #dcfce7; } .t.green .tl, .t.green .tu { color: #166534; }
.t.blue { background: #dbeafe; } .t.blue .tl, .t.blue .tu { color: #1e3a8a; }
.t.purple { background: #ede9fe; } .t.purple .tl, .t.purple .tu { color: #5b21b6; }
.jo-instr { border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 10px; }
.jo-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pc { border: 1px solid; border-radius: 6px; overflow: hidden; }
.pc-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; padding: 5px 10px; }
.pc-head svg { width: 15px; height: 15px; flex-shrink: 0; }
.pc-body { padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; }
.pc.purple { border-color: #c084fc; } .pc.purple .pc-head { background: #f3e8ff; color: #6b21a8; }
.pc.teal { border-color: #5eead4; } .pc.teal .pc-head { background: #ccfbf1; color: #115e59; }
.pc.orange { border-color: #fdba74; } .pc.orange .pc-head { background: #ffedd5; color: #9a3412; }
.pc.green { border-color: #86efac; } .pc.green .pc-head { background: #dcfce7; color: #166534; }
.jo-sigs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; text-align: center; }
.sig-label { font-size: 12px; font-weight: 600; color: #1e3a8a; margin-bottom: 34px; }
.sig-name { border-top: 1px solid #475569; padding-top: 4px; font-size: 13px; font-weight: 700; color: #b91c1c; word-break: break-word; }
.jo-footer { margin-top: auto; border-top: 1px solid #cbd5e1; padding-top: 8px; text-align: center; font-size: 12px; color: #475569; }

/* Result sheet + toast */
.sheet-back { position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-height: 92vh; }
.sheet h2 { font-size: 18px; color: #9a3412; }
.sheet p { font-size: 13px; color: #475569; }
.sheet img { width: 100%; max-height: 50vh; object-fit: contain; border: 1px solid #cbd5e1; border-radius: 8px; background: #f1f5f9; -webkit-touch-callout: default; }
.sheet .btn { width: 100%; text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #166534; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 200; box-shadow: 0 6px 20px rgba(15,23,42,0.3); }

/* ===================== HELPERS ===================== */
function todaysDate() {
  return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: '2-digit' });
}
function getValue(obj, path) {
  return path.split('.').reduce(function(acc, key) { return acc ? acc[key] : undefined; }, obj);
}
function setValue(obj, path, value) {
  var clone = JSON.parse(JSON.stringify(obj));
  var keys = path.split('.');
  var curr = clone;
  for (var i = 0; i < keys.length - 1; i++) {
    if (!curr[keys[i]]) curr[keys[i]] = {};
    curr = curr[keys[i]];
  }
  curr[keys[keys.length - 1]] = value;
  return clone;
}
function toggleArrayValue(arr, value) {
  if (!Array.isArray(arr)) arr = [];
  if (arr.indexOf(value) >= 0) return arr.filter(function(v) { return v !== value; });
  return arr.concat([value]);
}
function toggleSingleSelect(arr, value) {
  if (!Array.isArray(arr)) arr = [];
  if (arr.indexOf(value) >= 0) return [];
  return [value];
}
function formatChipArray(arr) {
  if (!Array.isArray(arr) || arr.length === 0) return '';
  return arr.join(', ');
}
function formatColorChoice(arr, spclColorName) {
  if (!Array.isArray(arr) || arr.length === 0) return '';
  var parts = arr.slice();
  var i = parts.indexOf('Spcl Color');
  if (i >= 0 && spclColorName && spclColorName.trim()) parts[i] = 'Spcl Color: ' + spclColorName.trim();
  return parts.join(', ');
}
function formatDeliveryDate(dateStr) {
  if (!dateStr || !dateStr.trim()) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr.trim());
  if (m) {
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (!isNaN(d.getTime())) return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: '2-digit' });
  }
  return dateStr;
}
function formatWithUnit(value, unit) {
  if (value === null || value === undefined) return '';
  var v = String(value).trim();
  if (!v) return '';
  return v + ' ' + unit;
}
function jobOrderSuffix(value) {
  if (value.indexOf(JOB_ORDER_PREFIX) === 0) return value.slice(JOB_ORDER_PREFIX.length);
  return value;
}
function normalizeJobOrderNo(value) {
  var v = String(value || '').trim();
  if (!v) return JOB_ORDER_PREFIX;
  if (v.indexOf(JOB_ORDER_PREFIX) === 0) return v;
  return JOB_ORDER_PREFIX + v.replace(/^[^a-zA-Z0-9]+/, '');
}
var JOB_ORDER_NUMBER_STORAGE_KEY = 'cgcJobOrderLastNumber';
function padJobOrderNumber(n) { var s = String(n); while (s.length < 5) s = '0' + s; return s; }
function getLastUsedJobOrderNumber() {
  try {
    var n = parseInt(window.localStorage.getItem(JOB_ORDER_NUMBER_STORAGE_KEY), 10);
    if (!isNaN(n) && n >= 0) return n;
  } catch (e) {}
  return 124;
}
function setLastUsedJobOrderNumber(n) {
  try { window.localStorage.setItem(JOB_ORDER_NUMBER_STORAGE_KEY, String(n)); } catch (e) {}
}
function generateNextJobOrderNo() { return JOB_ORDER_PREFIX + padJobOrderNumber(getLastUsedJobOrderNumber() + 1); }
function recordJobOrderNumberUsed(jobOrderNoValue) {
  var m = /(\d+)/.exec(jobOrderSuffix(String(jobOrderNoValue || '')));
  if (!m) return;
  var used = parseInt(m[1], 10);
  if (isNaN(used)) return;
  setLastUsedJobOrderNumber(Math.max(getLastUsedJobOrderNumber(), used));
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function applyUppercaseToInput(el, rawValue) {
  var upper = rawValue.toUpperCase();
  if (upper === rawValue) return rawValue;
  var a = el.selectionStart, b = el.selectionEnd;
  el.value = upper;
  if (a !== null && b !== null) { try { el.setSelectionRange(a, b); } catch (e) {} }
  return upper;
}
function slugifyForFilename(value) {
  if (!value) return '';
  return String(value).trim().replace(/[\\/:*?"<>|]+/g, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function generateExportFilename(d) {
  var parts = [
    slugifyForFilename(d.customer.customerName),
    slugifyForFilename(d.product.productName),
    slugifyForFilename(d.customer.destination)
  ].filter(function(p) { return p; });
  return (parts.length ? parts.join(' ') : 'JobOrder Export') + '.png';
}
function getMissingRequiredFields(d) {
  var missing = [];
  if (!d.customer.customerName || !d.customer.customerName.trim()) missing.push('Customer Name');
  if (!d.product.productName || !d.product.productName.trim()) missing.push('Product Name');
  if (!d.product.quantity || !String(d.product.quantity).trim()) missing.push('Quantity');
  return missing;
}
function $(id) { return document.getElementById(id); }

/* ===================== FORM RENDERING ===================== */
function chips(path, options, selectedArr, mode) {
  var selected = Array.isArray(selectedArr) ? selectedArr : [];
  var html = '<div class="chip-group" data-chip-group="' + path + '"' + (mode ? ' data-mode="' + mode + '"' : '') + '>';
  options.forEach(function(opt) {
    html += '<button type="button" class="chip' + (selected.indexOf(opt) >= 0 ? ' selected' : '') +
      '" data-chip-value="' + esc(opt) + '" data-path="' + path + '">' + esc(opt) + '</button>';
  });
  return html + '</div>';
}
function field(label, path, value, opts) {
  opts = opts || {};
  var id = 'f_' + path.replace(/\./g, '_');
  var attrs = 'id="' + id + '" class="form-input" type="' + (opts.type || 'text') + '" data-path="' + path + '"' +
    (opts.upper ? ' data-uppercase="true"' : '') + (opts.mode ? ' inputmode="' + opts.mode + '"' : '') +
    (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + ' value="' + esc(value) + '"';
  var input = '<input ' + attrs + '>';
  if (opts.unit) input = '<div class="unit-wrap">' + input + '<span class="unit">' + opts.unit + '</span></div>';
  return '<div class="form-field' + (opts.full ? ' full' : '') + (opts.hl ? ' hl-' + opts.hl : '') + '">' +
    '<label class="form-label" for="' + id + '">' + esc(label) + '</label>' + input + '</div>';
}
function area(label, path, value) {
  var id = 'f_' + path.replace(/\./g, '_');
  return '<div class="form-field full sub-gap"><label class="form-label" for="' + id + '">' + esc(label) + '</label>' +
    '<textarea id="' + id + '" class="form-textarea" data-path="' + path + '" data-uppercase="true">' + esc(value) + '</textarea></div>';
}
function chipField(label, html, extraClass) {
  return '<div class="form-field full' + (extraClass ? ' ' + extraClass : '') + '"><span class="form-label">' + esc(label) + '</span>' + html + '</div>';
}
function card(title, body, kind, icon) {
  return '<div class="card' + (kind ? ' k-' + kind : '') + '"><div class="card-head">' + (icon || '') + '<span>' + esc(title) + '</span></div><div class="card-body">' + body + '</div></div>';
}

function placePreview() {
  var pane = $('previewPane');
  (isDesktop ? $('previewCol') : $('exportPreviewSlot')).appendChild(pane);
}
function renderAllPanels() {
  for (var i = 0; i < 4; i++) document.querySelector('[data-panel="' + i + '"]').innerHTML = renderPanel(i);
}
function setStep(n) {
  step = Math.max(0, Math.min(4, n));
  document.body.setAttribute('data-step', String(step));
  document.querySelectorAll('.step-btn').forEach(function(b) {
    var on = Number(b.getAttribute('data-step')) === step;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  document.querySelectorAll('.step-panel').forEach(function(pn) {
    pn.classList.toggle('active', Number(pn.getAttribute('data-panel')) === step);
  });
  var back = document.querySelector('[data-action="back"]');
  var next = document.querySelector('[data-action="next"]');
  back.style.visibility = step === 0 ? 'hidden' : 'visible';
  next.textContent = busy ? 'Exporting…' : (step === 4 ? 'Export Image' : 'Next: ' + STEPS[step + 1]);
  updatePreview();
}

/* ===================== PREVIEW UPDATE + ONE-PAGE FIT ===================== */
function schedulePreviewUpdate() {
  if (previewRaf) cancelAnimationFrame(previewRaf);
  previewRaf = requestAnimationFrame(function() { previewRaf = null; updatePreview(); });
}
function previewVisible() {
  var w = $('previewWrap');
  return !!(w && w.offsetParent !== null);
}
function updatePreview() {
  $('topbarSub').textContent = state.jobOrderNo + ' · ' + state.date;
  var inner = $('previewInner');
  inner.innerHTML = renderPreviewHTML(state);
  inner.querySelector('.jo-logo-box').appendChild(logoImgEl);
  if (previewVisible()) { layoutPreview(); fitPage(); }
  updateExportInfo();
}
// Scales the on-screen copy only. The transform sits on a parent of the page,
// so the exported page itself is always exactly 794 x 1123.
function layoutPreview() {
  var wrap = $('previewWrap'), sizer = $('previewSizer'), inner = $('previewInner');
  var avail = wrap.clientWidth - 24;
  var s = zoomed ? 1 : Math.min(1, Math.max(0.2, avail / PAGE_W));
  sizer.style.width = (PAGE_W * s) + 'px';
  sizer.style.height = (PAGE_H * s) + 'px';
  inner.style.transform = 'scale(' + s + ')';
}
// Keeps everything on one A4 page: if the content is taller than the page,
// it is shrunk (and re-wrapped wider) until it fits, down to MIN_FIT.
function fitPage() {
  var fit = document.querySelector('#jobOrderPreview .jo-fit');
  if (!fit) return;
  function heightAt(s) {
    fit.style.minHeight = '0';
    fit.style.width = (FIT_W / s) + 'px';
    return fit.offsetHeight * s;
  }
  var s = 1, fits = true;
  if (heightAt(1) > FIT_H) {
    if (heightAt(MIN_FIT) > FIT_H) { s = MIN_FIT; fits = false; }
    else {
      var lo = MIN_FIT, hi = 1;
      for (var i = 0; i < 8; i++) { var mid = (lo + hi) / 2; if (heightAt(mid) <= FIT_H) lo = mid; else hi = mid; }
      s = lo;
    }
  }
  fit.style.width = (FIT_W / s) + 'px';
  fit.style.minHeight = (FIT_H / s) + 'px';
  fit.style.transform = s === 1 ? 'none' : 'scale(' + s + ')';
  fitInfo = { scale: s, fits: fits };
}
function updateExportInfo() {
  var missing = getMissingRequiredFields(state);
  var cls, txt;
  if (!fitInfo.fits) { cls = 'bad'; txt = 'Too long for one page – shorten the instructions'; }
  else if (fitInfo.scale < 0.999) { cls = 'warn'; txt = 'Fits 1 A4 page (text reduced to ' + Math.round(fitInfo.scale * 100) + '%)'; }
  else { cls = 'ok'; txt = 'Fits 1 A4 page'; }
  var badge = $('fitBadge');
  badge.className = 'fit-badge ' + cls;
  badge.textContent = cls === 'ok' ? 'Fits 1 page' : (cls === 'warn' ? 'Fits · ' + Math.round(fitInfo.scale * 100) + '%' : 'Too long');
  $('exportInfo').innerHTML =
    '<div class="info ' + cls + '"><div class="k">Page size</div><div class="v">' + txt + '</div></div>' +
    '<div class="info ' + (missing.length ? 'bad' : 'ok') + '"><div class="k">Required fields</div><div class="v">' +
      (missing.length ? 'Missing: ' + esc(missing.join(', ')) : 'All complete') + '</div></div>' +
    '<div class="info"><div class="k">File name</div><div class="v">' + esc(generateExportFilename(state)) + '</div></div>';
}

/* ===================== EVENTS ===================== */
function attachListeners() {
  var panels = $('panels');
  panels.addEventListener('input', function(e) {
    var el = e.target;
    var path = el.getAttribute('data-path');
    if (!path) return;
    var value = el.value;
    if (el.getAttribute('data-type') === 'jobOrderNo') value = normalizeJobOrderNo(value);
    else if (el.getAttribute('data-uppercase') === 'true') value = applyUppercaseToInput(el, value);
    state = setValue(state, path, value);
    schedulePreviewUpdate();
  });
  document.addEventListener('click', function(e) {
    var chip = e.target.closest('.chip');
    if (chip) {
      var path = chip.getAttribute('data-path');
      var group = chip.closest('.chip-group');
      var mode = group.getAttribute('data-mode');
      var value = chip.getAttribute('data-chip-value');
      var arr = mode === 'single' ? toggleSingleSelect(getValue(state, path), value) : toggleArrayValue(getValue(state, path), value);
      state = setValue(state, path, arr);
      if (mode === 'rerender') {
        document.querySelector('[data-panel="2"]').innerHTML = renderPanel(2);
      } else {
        group.querySelectorAll('.chip').forEach(function(c) {
          c.classList.toggle('selected', arr.indexOf(c.getAttribute('data-chip-value')) >= 0);
        });
      }
      schedulePreviewUpdate();
      return;
    }
    var stepBtn = e.target.closest('.step-btn');
    if (stepBtn) { goStep(Number(stepBtn.getAttribute('data-step'))); return; }
    var act = e.target.closest('[data-action]');
    if (act) {
      var a = act.getAttribute('data-action');
      if (a === 'today') { state = setValue(state, 'date', todaysDate()); $('f_date').value = state.date; schedulePreviewUpdate(); }
      else if (a === 'back') goStep(step - 1);
      else if (a === 'next') { if (step === 4) doExport(); else goStep(step + 1); }
      else if (a === 'export') doExport();
      else if (a === 'reset') doReset();
      return;
    }
    if (e.target.closest('#previewSizer') && !isDesktop) { zoomed = !zoomed; layoutPreview(); }
  });
  desktopMq.addEventListener('change', function(e) {
    if (busy) return;
    isDesktop = e.matches; zoomed = false;
    placePreview(); updatePreview();
  });
  window.addEventListener('resize', function() {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function() { resizeRaf = null; if (previewVisible()) layoutPreview(); });
  });
}
function goStep(n) {
  if (busy) return;
  setStep(n);
  window.scrollTo(0, 0);
}
function doReset() {
  if (busy) return;
  if (!confirm('Start a new order? Everything typed in this order will be cleared.')) return;
  state = createDefaultState();
  renderAllPanels();
  setStep(0);
  window.scrollTo(0, 0);
}

/* ===================== EXPORT (no watermark) ===================== */
function withTimeout(promise, ms, message) {
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() { reject(new Error(message)); }, ms);
    promise.then(function(v) { clearTimeout(timer); resolve(v); }, function(e) { clearTimeout(timer); reject(e); });
  });
}
function nextFrame() {
  return new Promise(function(resolve) {
    var done = false;
    function fin() { if (!done) { done = true; resolve(); } }
    requestAnimationFrame(function() { requestAnimationFrame(fin); });
    setTimeout(fin, 400); // rAF does not fire while the app is in the background
  });
}
function setBusy(b) {
  busy = b;
  document.querySelectorAll('[data-action="export"], [data-action="reset"], [data-action="back"]').forEach(function(x) { x.disabled = b; });
  var next = document.querySelector('[data-action="next"]');
  next.disabled = b;
  next.textContent = b ? 'Exporting…' : (step === 4 ? 'Export Image' : 'Next: ' + STEPS[step + 1]);
  var ex = document.querySelector('[data-action="export"]');
  ex.textContent = b ? 'Exporting…' : 'Export Image';
}
// The header logo is painted straight onto the finished canvas instead of going
// through html-to-image, so it cannot be dropped by the browser's SVG rendering.
function drawLogoOnCanvas(canvas, pageEl) {
  return logoReady.then(function() {
    if (!logoOk) return false;
    var box = pageEl.querySelector('.jo-logo-box');
    var pr = pageEl.getBoundingClientRect(), br = box.getBoundingClientRect();
    var k = (PAGE_W / pr.width) * (canvas.width / PAGE_W);
    var bx = (br.left - pr.left) * k, by = (br.top - pr.top) * k, bw = br.width * k, bh = br.height * k;
    var r = Math.min(bw / logoImgEl.naturalWidth, bh / logoImgEl.naturalHeight);
    var w = logoImgEl.naturalWidth * r, h = logoImgEl.naturalHeight * r;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(logoImgEl, bx + (bw - w) / 2, by + (bh - h) / 2, w, h);
    return true;
  });
}
function canvasToBlob(canvas) {
  return new Promise(function(resolve, reject) {
    canvas.toBlob(function(b) { if (b) resolve(b); else reject(new Error('Could not create the image.')); }, 'image/png');
  });
}
function doExport() {
  if (busy) return;
  if (!isDesktop && step !== 4) { setStep(4); return; }
  try {
    if (previewRaf) { cancelAnimationFrame(previewRaf); previewRaf = null; }
    updatePreview(); // always export the latest state
    var missing = getMissingRequiredFields(state);
    if (missing.length && !confirm('These required fields are empty:\n\n' + missing.map(function(f) { return '• ' + f; }).join('\n') + '\n\nExport anyway?')) return;
    if (!fitInfo.fits && !confirm('The order is too long for one A4 page and the bottom will be cut off.\n\nExport anyway?')) return;

    setBusy(true);
    var exported = state;
    var filename = generateExportFilename(exported);
    var el = $('jobOrderPreview');
    var logoDrawn = true;
    nextFrame()
      .then(function() {
        return withTimeout(htmlToImage.toCanvas(el, {
          pixelRatio: 3, backgroundColor: '#ffffff', width: PAGE_W, height: PAGE_H,
          filter: function(node) { return !(node.classList && node.classList.contains('jo-logo-img')); }
        }), 20000, 'Image generation timed out. Please try again.');
      })
      .then(function(canvas) {
        return drawLogoOnCanvas(canvas, el).then(function(ok) { logoDrawn = ok; return canvasToBlob(canvas); });
      })
      .then(function(blob) { return deliver(blob, filename); })
      .then(function(result) {
        if (result !== 'cancelled') recordJobOrderNumberUsed(exported.jobOrderNo);
        setBusy(false);
        if (!logoDrawn) alert('The image was exported, but the logo could not be loaded. Please close and reopen the app.');
        else if (result === 'shared' || result === 'downloaded') toast('Exported');
      })
      .catch(function(err) {
        setBusy(false);
        alert('Export failed: ' + (err && err.message ? err.message : err));
      });
  } catch (err) {
    setBusy(false);
    alert('Export failed: ' + (err && err.message ? err.message : err));
  }
}
function isTouchDevice() {
  return window.matchMedia('(pointer: coarse)').matches || /iPad|iPhone|iPod|Android/.test(navigator.userAgent);
}
function canShareFile(file) {
  try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { return false; }
}
function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
}
// Phone/tablet: share sheet. If the system refuses it (the tap is "too old" after
// the image was generated), a sheet shows the image with a fresh Share button.
// Desktop: normal file download.
function deliver(blob, filename) {
  var file = new File([blob], filename, { type: 'image/png' });
  if (isTouchDevice()) {
    if (canShareFile(file)) {
      return navigator.share({ files: [file], title: filename }).then(
        function() { return 'shared'; },
        function(err) {
          if (err && err.name === 'AbortError') return 'cancelled';
          showResultSheet(blob, file, filename); return 'sheet';
        });
    }
    showResultSheet(blob, file, filename);
    return Promise.resolve('sheet');
  }
  downloadBlob(blob, filename);
  return Promise.resolve('downloaded');
}
function showResultSheet(blob, file, filename) {
  var url = URL.createObjectURL(blob);
  var back = document.createElement('div');
  back.className = 'sheet-back';
  var share = canShareFile(file);
  back.innerHTML = '<div class="sheet" role="dialog" aria-label="Exported image"><h2>Image ready</h2>' +
    '<p>' + (share ? 'Tap Share / Save, or press and hold the image to save it.' : 'Press and hold the image to save it, or use Download.') + '</p>' +
    '<img alt="Exported job order" src="' + url + '">' +
    (share ? '<button type="button" class="btn btn-next" data-sheet="share">Share / Save</button>' : '') +
    '<a class="btn btn-back" data-sheet="download" href="' + url + '" download="' + esc(filename) + '">Download</a>' +
    '<button type="button" class="btn btn-back" data-sheet="close">Close</button></div>';
  back.addEventListener('click', function(e) {
    var t = e.target.closest('[data-sheet]');
    if (e.target === back || (t && t.getAttribute('data-sheet') === 'close')) {
      document.body.removeChild(back);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    } else if (t && t.getAttribute('data-sheet') === 'share') {
      navigator.share({ files: [file], title: filename }).catch(function() {});
    }
  });
  document.body.appendChild(back);
}
function toast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
}

/* ===================== INIT ===================== */
function init() {
  state = createDefaultState();
  renderShell();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
